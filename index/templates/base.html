{% load static %}
<!doctype html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}网络巡检中心{% endblock %}</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <script defer src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script defer src="{% static 'js/table_tools.js' %}"></script>
    <script defer src="{% static 'js/table_workspace.js' %}"></script>
    <script defer src="{% static 'js/task_ui.js' %}"></script>
</head>
<body class="app-shell">
    <a class="skip-link" href="#main-content">跳至主要内容</a>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar" aria-label="主导航">
        <div class="container-fluid app-navbar__inner">
            <a class="navbar-brand fw-semibold" href="{% url 'index' %}">网络巡检中心</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="切换主导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'asset_list' 'people' %}">人员</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'domain_controller_settings' %}">域控管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'asset_list' 'computers' %}">PC</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'asset_list' 'networks' %}">网络设备</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'asset_list' 'servers' %}">服务器</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'asset_list' 'monitors' %}">安防设备</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'task_list' %}">后台任务</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'alert_list' %}">告警记录</a></li>
                </ul>
                <span class="navbar-text small">终端与基础设施状态</span>
            </div>
        </div>
    </nav>
    <main class="container-fluid app-main" id="main-content" tabindex="-1">
        {% if messages %}
        {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="app-footer text-center small">Network Inspection Center</footer>
</body>
</html>
