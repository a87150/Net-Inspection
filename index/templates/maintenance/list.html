{% extends 'common/base.html' %}
{% load static %}
{% block title %}维护记录{% endblock %}
{% block content %}
<header class="page-heading">
    <div class="page-heading__copy">
        <p class="page-heading__eyebrow">告警维护</p>
        <h1 class="page-heading__title">维护记录</h1>
        <p class="page-heading__description">计划变更时间窗：窗口内相关资产的告警照常入库，但不外发。</p>
    </div>
</header>
{% csrf_token %}
<div data-table-workspace data-table-key="maintenance-windows">
    <div id="maintenance-page" data-vue-page="maintenance-list" data-vue-bootstrap="maintenance-bootstrap">
        <noscript><p class="alert alert-warning">这页由 Vue 渲染，需要开启 JavaScript。</p></noscript>
    </div>
</div>
{{ bootstrap|json_script:"maintenance-bootstrap" }}
{% endblock %}
{% block page_scripts %}
<script type="module" src="{% static 'app/vue/boot.mjs' %}"></script>
{% endblock %}
