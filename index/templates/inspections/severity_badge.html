{% if level == 'critical' %}<span class="badge status-badge text-bg-danger" data-status="critical">严重</span>{% elif level == 'warning' %}<span class="badge status-badge text-bg-warning" data-status="warning">警告</span>{% elif level == 'info' %}<span class="badge status-badge text-bg-info" data-status="info">提示</span>{% elif level == 'normal' or level == 'success' %}<span class="badge status-badge text-bg-success" data-status="{{ level }}">正常</span>{% else %}<span class="badge status-badge text-bg-secondary" data-status="unknown">未知</span>{% endif %}
