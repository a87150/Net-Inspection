<span class="badge status-badge {% if status == 'success' or status == 'normal' or status == 'recovery' or status == 'sent' or status == 'delivered' or status == 'enabled' or status == 'completed' %}text-bg-success{% elif status == 'failed' or status == 'abnormal' or status == 'error' or status == 'critical' %}text-bg-danger{% elif status == 'partial' or status == 'warning' or status == 'retry' or status == 'blocked' %}text-bg-warning{% elif status == 'cancelled' or status == 'disabled' or status == 'skipped' or status == 'unknown' %}text-bg-secondary{% else %}text-bg-info{% endif %}" data-status="{{ status|default:'unknown' }}">{{ label|default:'未知' }}</span>
