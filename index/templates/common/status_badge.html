<span class="badge status-badge {% if status == 'success' or status == 'normal' or status == 'recovery' %}text-bg-success{% elif status == 'failed' or status == 'abnormal' or status == 'error' %}text-bg-danger{% elif status == 'partial' or status == 'warning' %}text-bg-warning{% elif status == 'cancelled' or status == 'disabled' %}text-bg-secondary{% else %}text-bg-info{% endif %}" data-status="{{ status|default:'unknown' }}">{{ label|default:'未知' }}</span>
