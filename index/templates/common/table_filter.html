{% load extras %}
<form method="get" class="card surface-card mb-4">
    <div class="card-body d-flex flex-column flex-lg-row gap-2 align-items-lg-end">
        <div class="flex-grow-1">
            <label class="form-label small text-secondary">关键字</label>
            <input class="form-control" name="{{ table_state.parameter_names.q }}" value="{{ table_state.q }}" placeholder="输入名称、地址或其他关键字">
        </div>
        {% if table_state.categories %}
        <div>
            <label class="form-label small text-secondary">设备类型</label>
            <select class="form-select" name="{{ table_state.parameter_names.category }}">
                <option value="">全部类型</option>
                {% for category in table_state.categories %}<option value="{{ category }}" {% if table_state.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}
            </select>
        </div>
        {% endif %}
        {% if status_options %}
        <div>
            <label class="form-label small text-secondary">状态</label>
            <select class="form-select" name="{{ table_state.parameter_names.status }}">
                <option value="">全部状态</option>
                {% for value, label in status_options %}<option value="{{ value }}" {% if table_state.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
            </select>
        </div>
        {% endif %}
        <div>
            <label class="form-label small text-secondary">排序字段</label>
            <select class="form-select" name="{{ table_state.parameter_names.sort }}">
                {% for value, label in sort_options %}<option value="{{ value }}" {% if table_state.sort == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="form-label small text-secondary">顺序</label>
            <select class="form-select" name="{{ table_state.parameter_names.order }}">
                <option value="asc" {% if table_state.order == 'asc' %}selected{% endif %}>升序</option>
                <option value="desc" {% if table_state.order == 'desc' %}selected{% endif %}>降序</option>
            </select>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary text-nowrap" type="submit">筛选</button>
            <a class="btn btn-outline-secondary text-nowrap" href="{{ request.path }}">重置</a>
        </div>
    </div>
</form>
