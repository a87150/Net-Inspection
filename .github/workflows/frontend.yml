name: Frontend checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_ENGINE: sqlite
      DJANGO_SQLITE_PATH: /tmp/net-frontend-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check Django and templates
        run: |
          python manage.py check
          python manage.py test tests.frontend --verbosity 1
      - name: Check JavaScript
        run: |
          node --test tests/frontend/*.test.js
          find static/app/js -name '*.js' -print0 | xargs -0 -n1 node --check
